# Publishes wiki/*.md to the repository's GitHub wiki whenever they change on main.
#
# One-time setup: open the repo's Wiki tab and create any first page (GitHub only creates the wiki
# repository then). After that this workflow keeps the wiki equal to the wiki/ folder.
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ["wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync wiki/ to the wiki repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git" "$RUNNER_TEMP/wiki" || {
            echo "::error::The wiki repository does not exist yet. Create a first page in the Wiki tab, then re-run this workflow."
            exit 1
          }

          # make the wiki an exact copy of wiki/ (pages removed here are removed there)
          find "$RUNNER_TEMP/wiki" -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r wiki/. "$RUNNER_TEMP/wiki/"

          cd "$RUNNER_TEMP/wiki"
          git add -A

          if git diff --cached --quiet; then
            echo "wiki already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
